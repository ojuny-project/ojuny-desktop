name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  options:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Generate the options reference
        run: python3 scripts/gen-options.py
      - name: Fail when the checked-in reference is stale
        run: |
          if ! git diff --exit-code -- options.generated.md; then
            echo "options.generated.md is stale; run python3 scripts/gen-options.py" >&2
            exit 1
          fi

  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md
      - name: Fail on placeholder strings
        run: |
          paths="README.md"
          if [ -d docs ]; then
            paths="$paths docs"
          fi
          if command -v rg >/dev/null 2>&1; then
            matches=$(rg -n --no-heading -g '!notes/**' \
              -e 'your-org' -e 'github:you/' -e 'TODO' -e 'TBD' \
              -e 'coming soon' -e 'see defaults/schema' $paths || true)
          else
            matches=$(grep -RInE --exclude-dir=notes \
              'your-org|github:you/|TODO|TBD|coming soon|see defaults/schema' $paths || true)
          fi
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi
